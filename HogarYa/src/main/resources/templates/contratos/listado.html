
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Listado de Contratos</title>
</head>
<body>

<h1>Contratos</h1>


<p th:if="${exito}" th:text="${exito}" style="color:green"></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>

<a href="/contratos/nuevo">Nuevo Contrato</a>

<h3>Filtros</h3>
<form action="/contratos" method="get">
  Propiedad:
  <select name="propiedadId">
    <option value="">Todas</option>
    <option th:each="p : ${propiedades}"
            th:value="${p.id}" th:text="${p.direccion}"></option>
  </select>

  Inquilino:
  <select name="inquilinoId">
    <option value="">Todos</option>
    <option th:each="i : ${inquilinos}"
            th:value="${i.id}"
            th:text="${i.apellido + ', ' + i.nombre}"></option>
  </select>

  Estado:
  <select name="estado">
    <option value="">Todos</option>
    <option th:each="e : ${estados}"
            th:value="${e}" th:text="${e}"></option>
  </select>

  Fecha de inicio: <input type="date" name="fechaInicio">

  <button type="submit">Filtrar</button>
  <a href="/contratos">Limpiar</a>
</form>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Propiedad</th>
    <th>Propietario</th>
    <th>Inquilino</th>
    <th>Fecha de inicio</th>
    <th>Importe mensual</th>
    <th>Dia de vencimiento</th>
    <th>Estado</th>
    <th>Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="c : ${contratos}">
    <td th:text="${c.id}"></td>
    <td th:text="${c.propiedad.direccion}"></td>
    <td th:text="${c.propiedad.propietario.apellido + ', ' +
c.propiedad.propietario.nombre}"></td>
    <td th:text="${c.inquilino.apellido + ', ' + c.inquilino.nombre}"></td>
    <td th:text="${c.fechaInicio}"></td>
    <td th:text="${c.importeMensual}"></td>
    <td th:text="${c.diaVencimientoMensual}"></td>
    <td th:text="${c.estado}"></td>
    <td>
      <a th:href="@{/contratos/editar/{id}(id=${c.id})}">Editar</a>
      <form th:action="@{/contratos/eliminar/{id}(id=${c.id})}"
            method="post" style="display:inline"
            onsubmit="return confirm('¿Eliminar este contrato?')">
        <button type="submit">Eliminar</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
